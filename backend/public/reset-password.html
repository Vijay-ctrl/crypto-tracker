<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Reset Password - CryptoTracker</title>

   <style>
      * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
      }

      body {
         font-family: Arial, sans-serif;
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center;
         background: #f4f7fb;
      }

      .container {
         width: 100%;
         max-width: 430px;
         padding: 20px;
      }

      .card {
         background: white;
         padding: 35px;
         border-radius: 16px;
         box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      }

      .logo {
         text-align: center;
         font-size: 28px;
         font-weight: bold;
         margin-bottom: 10px;
      }

      .subtitle {
         text-align: center;
         color: #64748b;
         margin-bottom: 30px;
      }

      label {
         display: block;
         margin-bottom: 8px;
         font-weight: 600;
      }

      input {
         width: 100%;
         padding: 13px;
         border: 1px solid #cbd5e1;
         border-radius: 8px;
         margin-bottom: 18px;
         font-size: 15px;
      }

      input:focus {
         outline: none;
         border-color: #2563eb;
      }

      button {
         width: 100%;
         padding: 14px;
         border: none;
         border-radius: 8px;
         background: #2563eb;
         color: white;
         font-size: 16px;
         font-weight: bold;
         cursor: pointer;
      }

      button:hover {
         background: #1d4ed8;
      }

      button:disabled {
         background: #94a3b8;
         cursor: not-allowed;
      }

      .message {
         margin-top: 20px;
         padding: 12px;
         border-radius: 8px;
         display: none;
         text-align: center;
      }

      .success {
         background: #dcfce7;
         color: #166534;
      }

      .error {
         background: #fee2e2;
         color: #991b1b;
      }

      .login-link {
         text-align: center;
         margin-top: 20px;
      }

      .login-link a {
         color: #2563eb;
         text-decoration: none;
         font-weight: 600;
      }
   </style>
</head>

<body>

   <div class="container">

      <div class="card">

         <div class="logo">
            CryptoTracker
         </div>

         <p class="subtitle">
            Create a new password
         </p>

         <form id="resetForm">

            <label for="password">
               New Password
            </label>

            <input type="password" id="password" placeholder="Enter new password" minlength="6" required>

            <label for="confirmPassword">
               Confirm Password
            </label>

            <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" required>

            <button type="submit" id="resetButton">
               Reset Password
            </button>

         </form>

         <div id="message" class="message"></div>

         <div class="login-link">
            <a href="/">
               Back to CryptoTracker
            </a>
         </div>

      </div>

   </div>


   <script>

      // ========================================
      // Get reset token from URL
      // ========================================

      const urlParams = new URLSearchParams(
         window.location.search
      );

      const token = urlParams.get("token");


      // ========================================
      // Form
      // ========================================

      const form =
         document.getElementById("resetForm");

      const message =
         document.getElementById("message");

      const resetButton =
         document.getElementById("resetButton");


      // ========================================
      // Show message
      // ========================================

      function showMessage(text, type) {

         message.textContent = text;

         message.className =
            `message ${type}`;

         message.style.display = "block";
      }


      // ========================================
      // Check token
      // ========================================

      if (!token) {

         showMessage(
            "Invalid or missing password reset link.",
            "error"
         );

         resetButton.disabled = true;
      }


      // ========================================
      // Reset Password
      // ========================================

      form.addEventListener("submit", async (event) => {

         event.preventDefault();

         const password =
            document.getElementById("password").value;

         const confirmPassword =
            document.getElementById("confirmPassword").value;


         // Check passwords

         if (password.length < 6) {

            showMessage(
               "Password must be at least 6 characters.",
               "error"
            );

            return;
         }


         if (password !== confirmPassword) {

            showMessage(
               "Passwords do not match.",
               "error"
            );

            return;
         }


         resetButton.disabled = true;

         resetButton.textContent =
            "Resetting...";


         try {

            const response = await fetch(
               `/api/auth/reset-password/${token}`,
               {
                  method: "POST",

                  headers: {
                     "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                     password
                  })
               }
            );


            const data =
               await response.json();


            if (!response.ok) {

               throw new Error(
                  data.message ||
                  "Unable to reset password"
               );
            }


            showMessage(
               "Password reset successful! You can now login.",
               "success"
            );


            form.reset();

            resetButton.textContent =
               "Password Reset Successfully";


         } catch (error) {

            console.error(
               "Password reset error:",
               error
            );

            showMessage(
               error.message,
               "error"
            );

            resetButton.disabled = false;

            resetButton.textContent =
               "Reset Password";
         }

      });

   </script>

</body>

</html>
